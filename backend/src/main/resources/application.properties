spring.application.name=venturelens
server.port=8085

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/venturelens_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate Table Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB